<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>模型进度</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#222;--muted:#777;--line:#e7e7e7;--good:#287451;--bad:#b1493f;--wait:#9b6819;font-family:system-ui,"Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65}main{max-width:780px;margin:auto;padding:36px 24px 60px}h1,h2,h3,p{margin:0}h1{font-size:23px;font-weight:600}h2,h3{font-size:15px;font-weight:600}header{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.muted,small{color:var(--muted);font-size:12px}.components{display:flex;flex-wrap:wrap;gap:8px 24px;margin:22px 0 16px}.component{display:flex;gap:8px;align-items:center}.status{white-space:nowrap;color:var(--muted);font-size:13px}.status.verified{color:var(--good)}.status.failed,.status.not_supported,.status.not_satisfied{color:var(--bad)}.status.running,.status.blocked{color:var(--wait)}.checks{margin-bottom:22px;border-top:1px solid var(--line)}.check{border-bottom:1px solid var(--line);padding:9px 0}.check summary{display:flex;justify-content:space-between;gap:16px;font-size:14px;font-weight:400}.check p{margin:6px 0 1px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.fold{border-top:1px solid var(--line);padding:13px 0}summary{cursor:pointer;font-weight:500}summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}.content{padding:12px 0 6px}.step{padding:9px 0}.step summary{font-weight:400}.step .status{margin-left:10px}.text{white-space:pre-wrap;overflow-wrap:anywhere}.step p{margin:8px 0}.step small{display:block}.figure{margin:8px 0 24px}.figure img{display:block;max-width:100%;height:auto;margin:10px auto;background:#fff}.figure p{margin:6px 0}.section{padding:16px 0;border-bottom:1px solid var(--line)}.section h3{margin-bottom:10px}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}a{color:inherit;text-underline-offset:3px}.formula{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,Consolas,monospace;margin:10px 0}.warnings{margin:0 0 18px;color:var(--bad);font-size:13px}.warnings ul{margin:6px 0;padding-left:20px}.info{margin-top:10px;font-size:12px;color:var(--muted)}.info .text{margin:8px 0}.sources{margin-top:8px;overflow-wrap:anywhere}figure{margin:0}
@media(prefers-color-scheme:dark){:root{--bg:#181a1d;--ink:#e8e8e8;--muted:#a1a1a1;--line:#343639;--good:#8bceab;--bad:#eea49b;--wait:#dec088}}
@media(max-width:520px){main{padding:24px 18px 40px}header{align-items:start}.components{gap:5px 18px}.check summary{gap:10px}.component{font-size:13px}}
@media print{main{max-width:none}details>.content,details>p{display:block!important}.figure{break-inside:avoid}a[download]{display:none}}
</style>
</head>
<body>
<main>
<header><h1>模型进度</h1><span class="muted">已保存记录 · 非实时</span></header>
<div id="components" class="components" aria-label="模型部分"></div>
<div id="checks" class="checks" aria-label="验证状态"></div>
<details id="warnings" class="warnings" hidden><summary id="warning-title">待处理</summary><ul id="warning-list"></ul></details>
<details class="fold" id="construction"><summary id="construction-title">构建说明</summary><div id="steps" class="content"></div></details>
<details class="fold" id="figure-fold"><summary id="figure-title">结果图</summary><div id="figures" class="content"></div></details>
<details class="fold" id="report-fold"><summary>完整报告</summary><div class="content"><a id="download-report" download="results.md" hidden>下载报告</a><div id="delivery"></div></div></details>
<details class="info"><summary>记录信息</summary><div id="metadata" class="content"></div><div id="sources" class="sources"></div></details>
</main>
<script id="viewer-data" type="application/json">@@VIEWER_DATA@@</script>
<script>
"use strict";
(function(){
const data=JSON.parse(document.getElementById("viewer-data").textContent);
const byId=id=>document.getElementById(id);
function make(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e;}
const labels={pending:"□ 未完成",unverified:"□ 待核验",running:"⏳ 进行中",blocked:"⏸ 受阻",failed:"✗ 未通过",not_applicable:"— 未纳入",not_satisfied:"✗ 未满足",not_supported:"✗ 未获支持",not_evaluated:"□ 待评价",not_answered:"□ 未回答",partially_answered:"□ 部分回答"};
const passed={execution:"已运行",calibration:"已满足",independent_evaluation:"已支持",scientific_answer:"已回答",delivery:"已齐全"};
function status(row){const checked=row.checked===true&&row.state==="verified";const state=checked?"verified":Object.hasOwn(labels,row.state)?row.state:"unverified";return make("span",checked?"✅ "+(passed[row.id]||"已完成"):labels[state],"status "+state);}
function figureLink(id){const link=make("a","图 "+id);link.href="#figures";link.addEventListener("click",function(event){event.preventDefault();byId("figure-fold").open=true;const target=document.getElementById("figure-"+id);if(target)target.scrollIntoView({block:"start"});});return link;}
function figureLinks(ids,host){if(!ids||!ids.length)return;const links=make("div",null,"links");ids.forEach(id=>links.appendChild(figureLink(id)));host.appendChild(links);}
data.rows.filter(r=>r.kind==="component").forEach(function(r){const el=make("div",null,"component");el.appendChild(make("span",r.title));el.appendChild(status(r));byId("components").appendChild(el);});
data.rows.filter(r=>r.kind==="axis"||r.kind==="check").forEach(function(r){const el=make("details",null,"check"),head=make("summary");head.appendChild(make("span",r.title));head.appendChild(status(r));el.appendChild(head);el.appendChild(make("p",r.result||"尚无检查说明。"));byId("checks").appendChild(el);});
const steps=data.rows.filter(r=>r.kind==="step");
byId("construction-title").textContent="构建说明 · "+steps.filter(r=>r.checked===true).length+"/"+steps.length;
steps.forEach(function(s){const el=make("details",null,"step"),head=make("summary",s.title);head.appendChild(status(s));el.appendChild(head);el.appendChild(make("small","方法"));el.appendChild(make("p",s.method||"未记录构建方法。","text"));el.appendChild(make("small","结果"));el.appendChild(make("p",s.result||"未记录结果。","text"));figureLinks(s.figure_ids,el);byId("steps").appendChild(el);});
if(!steps.length)byId("steps").appendChild(make("p","尚无构建记录。","muted"));
const depictions={schematic:"示意图",actual_model:"实际模型",data_result:"实际结果",unspecified:"性质未说明"};
byId("figure-title").textContent="结果图 · "+data.figures.length;
data.figures.forEach(function(f){const el=make("figure",null,"figure");el.id="figure-"+f.id;el.appendChild(make("figcaption","图 "+f.id+" · "+(depictions[f.depiction]||"性质未说明")));if(f.caption)el.appendChild(make("p",f.caption));f.images.forEach(function(image){const img=make("img");img.src=image.uri;img.alt=f.caption||"图 "+f.id;img.loading="lazy";el.appendChild(img);});f.unavailable.forEach(reason=>el.appendChild(make("p","未显示："+reason,"muted")));if(!f.images.length&&!f.unavailable.length)el.appendChild(make("p","暂无图件。","muted"));byId("figures").appendChild(el);});
if(!data.figures.length)byId("figures").appendChild(make("p","暂无图件。","muted"));
data.sections.forEach(function(s,index){const el=make("article",null,"section");el.appendChild(make("h3",(index+1)+". "+s.title));el.appendChild(make("div",s.text||"尚未完成。","text"));(s.equations||[]).forEach(function(q){if(q.formula&&!(s.text||" ").includes(q.formula))el.appendChild(make("div",q.formula,"formula"));if(q.symbols_units&&!(s.text||" ").includes(q.symbols_units))el.appendChild(make("small",q.symbols_units));});figureLinks(s.figure_ids,el);byId("delivery").appendChild(el);});
if(data.followup_answers&&data.followup_answers.length){const el=make("article",null,"section");el.appendChild(make("h3","补充答复"));data.followup_answers.forEach(a=>el.appendChild(make("p",a.text,"text")));byId("delivery").appendChild(el);}
if(data.report_uri){byId("download-report").href=data.report_uri;byId("download-report").hidden=false;}
if(data.warnings.length){byId("warnings").hidden=false;byId("warning-title").textContent="待处理 · "+data.warnings.length;data.warnings.forEach(w=>byId("warning-list").appendChild(make("li",w)));}
byId("metadata").appendChild(make("div",data.title,"text"));
[["模型",data.model_version],["计划",data.plan_id],["分析",data.analysis_id],["生成时间",data.generated_utc]].forEach(p=>byId("metadata").appendChild(make("div",p[0]+"："+p[1])));
byId("metadata").appendChild(make("p",data.scope,"text"));
Object.keys(data.sources).forEach(name=>byId("sources").appendChild(make("div",name)));
})();
</script>
</body>
</html>
