<div class="toolbar-wrap"><header class="toolbar"><div class="toolbar-heading"><svg class="app-mark" width="23" height="23" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17M7 7h10M7 17h10" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="6" r="3" fill="currentColor"/><circle cx="18" cy="6" r="2.5" fill="currentColor"/><circle cx="6" cy="18" r="2.5" fill="currentColor"/><circle cx="18" cy="18" r="3" fill="currentColor"/></svg><span>模型进度</span></div><button id="appearance-button" class="tool-button" type="button" aria-haspopup="dialog" aria-controls="appearance-dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 010 16V4z" fill="currentColor"/></svg>显示</button></header></div>

<script>
"use strict";
(function(){
const data=JSON.parse(document.getElementById("viewer-data").textContent);

try{const saved=JSON.parse(localStorage.getItem(preferenceKey)||"null");if(saved&&typeof saved==="object"){if(["system","light","dark"].includes(saved.theme))preferences.theme=saved.theme;preferences.reduceMotion=saved.reduceMotion===true;preferences.reduceTransparency=saved.reduceTransparency===true;}}catch(error){/* Local preferences are optional, including offline and private windows. */}
const reducedMotion=()=>preferences.reduceMotion||motionQuery.matches;
function applyPreferences(save){
 root.dataset.theme=preferences.theme;
 root.dataset.motion=reducedMotion()?"reduced":"full";
 root.dataset.transparency=preferences.reduceTransparency||transparencyQuery.matches?"reduced":"full";
 const choices=["system","light","dark"];
 byId("appearance-control").style.setProperty("--choice",choices.indexOf(preferences.theme));
 document.querySelectorAll('input[name="appearance"]').forEach(input=>input.checked=input.value===preferences.theme);
 byId("reduce-motion").checked=reducedMotion();byId("reduce-motion").disabled=motionQuery.matches;
 byId("reduce-transparency").checked=preferences.reduceTransparency||transparencyQuery.matches;byId("reduce-transparency").disabled=transparencyQuery.matches;
 const systemNote=(motionQuery.matches||transparencyQuery.matches)?"系统已开启的减少效果设置继续生效。":"";
 byId("settings-note").textContent="仅改变本机显示，不修改模型与研究结果。"+systemNote;
 if(reducedMotion())document.getAnimations().forEach(animation=>{try{animation.finish();}catch(error){animation.cancel();}});
 if(save)try{localStorage.setItem(preferenceKey,JSON.stringify(preferences));}catch(error){/* Keep the selection for this view when storage is unavailable. */}
}
applyPreferences(false);
[motionQuery,transparencyQuery].forEach(query=>query.addEventListener("change",()=>applyPreferences(false)));
document.querySelectorAll('input[name="appearance"]').forEach(input=>input.addEventListener("change",()=>{if(input.checked){preferences.theme=input.value;applyPreferences(true);}}));
byId("reduce-motion").addEventListener("change",event=>{preferences.reduceMotion=event.target.checked;applyPreferences(true);});
byId("reduce-transparency").addEventListener("change",event=>{preferences.reduceTransparency=event.target.checked;applyPreferences(true);});
if(data.project_name){byId("project-title").textContent=data.project_name;document.title=data.project_name+" · 模型进度";}
if(data.generated_utc){const date=new Date(data.generated_utc);if(!Number.isNaN(date.getTime())){const time=byId("updated-time");time.dateTime=date.toISOString();time.textContent="更新于 "+date.toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});time.hidden=false;}}
function make(tag,text,cls){const element=document.createElement(tag);if(text!==undefined&&text!==null)element.textContent=String(text);if(cls)element.className=cls;return element;}
const labels={pending:"未完成",unverified:"尚未确认",running:"进行中",blocked:"受阻",failed:"未通过",not_applicable:"未纳入",not_satisfied:"未满足",not_supported:"未获支持",not_evaluated:"待评价",not_answered:"未回答",partially_answered:"部分回答"};
const passed={execution:"已运行",calibration:"已满足",independent_evaluation:"已支持",scientific_answer:"已回答",delivery:"已齐全"};
function status(row){
 const checked=row.checked===true&&row.state==="verified";
 const state=checked?"verified":Object.hasOwn(labels,row.state)?row.state:"unverified";
 const symbols={verified:"✓",running:"·",blocked:"Ⅱ",failed:"×",not_satisfied:"×",not_supported:"×",not_applicable:"—"};
 const node=make("span",null,"status "+state),icon=make("span",symbols[state]||"", "status-icon");icon.setAttribute("aria-hidden","true");node.append(icon,make("span",checked?(passed[row.id]||"已完成"):labels[state]));return node;
}
const foldAnimations=new WeakMap();
function setExpanded(details,open,animate=true){
 const previous=foldAnimations.get(details);const start=details.getBoundingClientRect().height;
 if(previous){previous.onfinish=null;previous.cancel();foldAnimations.delete(details);}
 details.style.height="";details.style.overflow="";
 const summary=details.querySelector(":scope > summary");summary.setAttribute("aria-expanded",String(open));
 if(!animate||reducedMotion()||!details.animate){details.open=open;return;}
 const closedHeight=summary.getBoundingClientRect().height;
 details.open=true;
 const end=open?details.getBoundingClientRect().height:closedHeight;
 details.style.overflow="hidden";
 const animation=details.animate([{height:start+"px"},{height:end+"px"}],{duration:230,easing:"cubic-bezier(.22,1,.36,1)"});
 foldAnimations.set(details,animation);
 animation.onfinish=()=>{details.open=open;details.style.height="";details.style.overflow="";foldAnimations.delete(details);};
}
function bindFold(details){
 const summary=details.querySelector(":scope > summary");summary.setAttribute("aria-expanded",String(details.open));
 summary.addEventListener("click",event=>{if(event.target.closest("a,button,input"))return;event.preventDefault();setExpanded(details,summary.getAttribute("aria-expanded")!=="true");});
 details.addEventListener("toggle",()=>{if(!foldAnimations.has(details))summary.setAttribute("aria-expanded",String(details.open));});
}
function figureLink(id){const link=make("a","图 "+id);link.href="#figures";link.addEventListener("click",event=>{event.preventDefault();setExpanded(byId("figure-fold"),true,false);const target=document.getElementById("figure-"+id);if(target){target.scrollIntoView({block:"start",behavior:reducedMotion()?"auto":"smooth"});const control=target.querySelector("button");if(control)control.focus({preventScroll:true});}});return link;}
function figureLinks(ids,host){if(!ids||!ids.length)return;const links=make("div",null,"links");ids.forEach(id=>links.appendChild(figureLink(id)));host.appendChild(links);}
const dialogs=new WeakMap();
function openDialog(dialog){if(dialog.open)return;dialogs.set(dialog,{origin:document.activeElement,animation:null});dialog.showModal();document.body.classList.add("modal-open");if(!reducedMotion()){const entry=dialogs.get(dialog);entry.animation=dialog.animate([{opacity:0,transform:"translateY(10px) scale(.985)"},{opacity:1,transform:"none"}],{duration:230,easing:"cubic-bezier(.22,1,.36,1)"});}}
function closeDialog(dialog){
 if(!dialog.open)return;const entry=dialogs.get(dialog)||{};if(entry.closing)return;entry.closing=true;dialogs.set(dialog,entry);
 if(entry.animation){entry.animation.onfinish=null;entry.animation.cancel();}
 const finish=()=>{dialog.close();document.body.classList.toggle("modal-open",Boolean(document.querySelector("dialog[open]")));if(entry.origin&&entry.origin.isConnected)entry.origin.focus({preventScroll:true});};
 if(reducedMotion()||!dialog.animate){finish();return;}
 entry.animation=dialog.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateY(7px) scale(.99)"}],{duration:150,easing:"ease-out"});entry.animation.onfinish=finish;
}
[byId("appearance-dialog"),byId("figure-dialog")].forEach(dialog=>{dialog.addEventListener("cancel",event=>{event.preventDefault();closeDialog(dialog);});dialog.addEventListener("click",event=>{if(event.target!==dialog)return;const bounds=dialog.getBoundingClientRect();if(event.clientX<bounds.left||event.clientX>bounds.right||event.clientY<bounds.top||event.clientY>bounds.bottom)closeDialog(dialog);});});
byId("appearance-button").addEventListener("click",()=>openDialog(byId("appearance-dialog")));
byId("appearance-close").addEventListener("click",()=>closeDialog(byId("appearance-dialog")));
byId("preview-close").addEventListener("click",()=>closeDialog(byId("figure-dialog")));
byId("image-size").addEventListener("click",()=>{const active=byId("preview-canvas").classList.toggle("actual-size");byId("image-size").setAttribute("aria-pressed",String(active));byId("image-size").textContent=active?"适合窗口":"原始大小";});
function showFigure(figure,image,index){byId("preview-title").textContent="图 "+figure.id+(figure.images.length>1?" · "+(index+1)+"/"+figure.images.length:"");byId("preview-caption").textContent=(figure.caption||"未记录图注。")+"\n"+(depictions[figure.depiction]||"性质未说明");byId("preview-image").src=image.uri;byId("preview-image").alt=figure.caption||"图 "+figure.id;byId("preview-canvas").classList.remove("actual-size");byId("image-size").setAttribute("aria-pressed","false");byId("image-size").textContent="原始大小";openDialog(byId("figure-dialog"));}
const rows=data.rows||[];
rows.filter(row=>row.kind==="component").forEach(row=>{const element=make("div",null,"component");element.append(make("span",row.title,"row-title"),status(row));byId("components").appendChild(element);});
if(!byId("components").childElementCount)byId("components").appendChild(make("p","尚无模型组成记录。","content empty"));
rows.filter(row=>row.kind==="axis"||row.kind==="check").forEach(row=>{const element=make("details",null,"check"),head=make("summary"),body=make("div",null,"details-body");head.append(make("span",row.title,"row-title"),status(row));body.appendChild(make("p",row.result||"尚无检查说明。"));element.append(head,body);byId("checks").appendChild(element);});
if(!byId("checks").childElementCount)byId("checks").appendChild(make("p","尚无验证记录。","content empty"));
const steps=rows.filter(row=>row.kind==="step");
byId("construction-count").textContent=steps.filter(row=>row.checked===true&&row.state==="verified").length+"/"+steps.length;
byId("construction-count").setAttribute("aria-label","已完成并检查的步骤 / 已登记步骤");
steps.forEach(step=>{const element=make("details",null,"step"),head=make("summary"),body=make("div",null,"details-body");head.append(make("span",step.title,"row-title"),status(step));body.append(make("small","方法"),make("p",step.method||"未记录构建方法。","text"),make("small","结果"),make("p",step.result||"未记录结果。","text"));figureLinks(step.figure_ids,body);element.append(head,body);byId("steps").appendChild(element);});
if(!steps.length)byId("steps").appendChild(make("p","尚无构建记录。","empty"));
const depictions={schematic:"示意图",actual_model:"实际模型",data_result:"实际结果",unspecified:"性质未说明"};
const figures=data.figures||[];byId("figure-count").textContent=String(figures.length);
figures.forEach(figure=>{const element=make("figure",null,"figure");element.id="figure-"+figure.id;element.appendChild(make("figcaption","图 "+figure.id+" · "+(depictions[figure.depiction]||"性质未说明")));if(figure.caption)element.appendChild(make("p",figure.caption));figure.images.forEach((image,index)=>{const button=make("button",null,"figure-open");button.type="button";button.setAttribute("aria-label","放大查看图 "+figure.id+(figure.images.length>1?"，第 "+(index+1)+" 张":""));button.setAttribute("aria-haspopup","dialog");button.setAttribute("aria-controls","figure-dialog");const img=make("img");img.src=image.uri;img.alt=figure.caption||"图 "+figure.id;img.loading="lazy";button.appendChild(img);button.addEventListener("click",()=>showFigure(figure,image,index));element.append(button,make("span","点按图件放大查看","figure-hint"));});figure.unavailable.forEach(reason=>element.appendChild(make("p","未显示："+reason,"muted")));if(!figure.images.length&&!figure.unavailable.length)element.appendChild(make("p","暂无图件。","muted"));byId("figures").appendChild(element);});
if(!figures.length)byId("figures").appendChild(make("p","暂无图件。","empty"));
(data.sections||[]).forEach((section,index)=>{const element=make("article",null,"section");element.append(make("h3",(index+1)+". "+section.title),make("div",section.text||"尚未完成。","text"));(section.equations||[]).forEach(equation=>{if(equation.formula&&!(section.text||" ").includes(equation.formula))element.appendChild(make("div",equation.formula,"formula"));if(equation.symbols_units&&!(section.text||" ").includes(equation.symbols_units))element.appendChild(make("small",equation.symbols_units));});figureLinks(section.figure_ids,element);byId("delivery").appendChild(element);});
if(data.followup_answers&&data.followup_answers.length){const element=make("article",null,"section");element.appendChild(make("h3","补充答复"));data.followup_answers.forEach(answer=>element.appendChild(make("p",answer.text,"text")));byId("delivery").appendChild(element);}
if(data.report_uri){byId("download-report").href=data.report_uri;byId("download-report").hidden=false;}
if(data.warnings&&data.warnings.length){byId("warnings").hidden=false;byId("warning-title").textContent="待处理 · "+data.warnings.length;data.warnings.forEach(warning=>byId("warning-list").appendChild(make("li",warning)));}
byId("metadata").appendChild(make("div",data.title,"text"));
[["模型",data.model_version],["计划",data.plan_id],["分析",data.analysis_id],["生成时间",data.generated_utc]].forEach(pair=>byId("metadata").appendChild(make("div",pair[0]+"："+(pair[1]||"未记录"))));
byId("metadata").appendChild(make("p",data.scope,"text"));Object.keys(data.sources||{}).forEach(name=>byId("sources").appendChild(make("div",name)));
document.querySelectorAll("main details").forEach(bindFold);
let printState=[];
window.addEventListener("beforeprint",()=>{printState=Array.from(document.querySelectorAll("main details"),details=>[details,details.querySelector(":scope > summary").getAttribute("aria-expanded")==="true"]);printState.forEach(([details])=>setExpanded(details,true,false));});
window.addEventListener("afterprint",()=>{printState.forEach(([details,open])=>setExpanded(details,open,false));printState=[];});
})();
</script>
</body>
</html>
