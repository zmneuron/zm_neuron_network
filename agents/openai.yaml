interface:
  display_name: "zm_neuron_network"
  short_description: "推敲科学问题及联系，开放选择方法，按问题构建迭代、实际运行并逐题解释结果"
  default_prompt: "用 $zm_neuron_network 从我的现象、问题或指定模型出发，调研并推敲可检验的问题及联系，明确必要机制、观测和比较；新建逐神经元网络优先用适用点模型，形态作用必需时采用多区室。实际构建运行并比较文献和真实数据，逐题解释结果并保留方法公式与数据图件；有待决定取舍时每轮集中讨论 2–3 问并给建议，设置确定后明确告知，默认构建有基础发放率的静息态网络。"
