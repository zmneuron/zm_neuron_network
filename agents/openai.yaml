# 本文件只提供 Codex 等宿主界面显示的技能名称、简短说明与默认提示。
# 它不是多代理平台或团队的导入配置：角色分工、工作目录、任务复核、预算
# 与版本固定需由宿主或编排平台另行设置，见 references/host-integration.md。
interface:
  display_name: "zm_neuron_network"
  short_description: "从现象或研究问题出发分档讨论构建与科学问题，调研、实际运行、比较并据实交付；模型与数据由研究工程提供"
  default_prompt: "用 $zm_neuron_network 研究并构建模型：目标尚不清楚时先调研并给出有依据的方向选项；新建先选三档，每阶段按档位讨论构建并另加 2–3 个科学问题；完成后继续优化先回看结果、调研方向，再分批讨论总计 5–7 个涵盖科学与模型的问题，设置明确后运行比较，交付前对照原要求核查五项完成状态，不沿用旧的提问结束状态跳过讨论。"
