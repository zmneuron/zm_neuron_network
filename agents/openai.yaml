interface:
  display_name: "zm_neuron_network"
  short_description: "从科研问题或实验材料选择模型，检索与补充共享资料，以实测读数检验预测。"
  default_prompt: "用 $zm_neuron_network 研究、构建或复现模型。收到实验方案、文稿或数据，先读材料，首轮用 3–5 问确认目标主图、模型范围与资源，对齐后比较三个方向。常规建模按三档讨论，开放式新优化通常共 7–10 问。先查共享文献与资源索引，有缺口就补查并回填。选定方向，在阶段设计明确度达到 95% 且关键取舍已解决后，实际运行、比较，按原目标交付。"
