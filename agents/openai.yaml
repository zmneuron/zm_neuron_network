interface:
  display_name: "zm_neuron_network"
  short_description: "从科学问题出发选模型与对照，分批确定设计，实际运行、比较并据实交付。模型与数据由研究工程提供。"
  default_prompt: "用 $zm_neuron_network 研究并构建模型。新建先讨论三档，在各档原有构建题和 2–3 个科学问题之外，每阶段增加 2–3 个会改变选模、判别对照或主图的追问。每批通常 2–3 问，依照阶段内已明确的必要决定核对 95% 设计把握，先解决关键取舍。完成后开放式新优化整轮通常共 7–10 问。逐题说明选模依据，执行已授权比较，交付前按原目标核查。"
