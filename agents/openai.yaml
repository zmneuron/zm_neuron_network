# 本文件只提供 Codex 等宿主界面显示的技能名称、简短说明与默认提示。
# 它不是多代理平台或团队的导入配置：角色分工、工作目录、任务复核、预算
# 与版本固定需由宿主或编排平台另行设置，见 references/host-integration.md。
interface:
  display_name: "zm_neuron_network"
  short_description: "从科研问题或实验材料选择模型，检索与补充共享资料，以实测读数检验预测。"
  default_prompt: |-
    用 $zm_neuron_network 研究、构建或复现模型。

    先依据研究者本次委托确定入口。已有材料且希望据此选择模型时，先读出已测量、拟测量和仍待解释的内容。目标或方向尚未明确时，只询问会改变主结论、判别实验或资源投入的取舍。方向明确后推荐建模档位。指定复现、局部修改或既定续跑直接沿用已有决定，只补本次动作缺少的信息。

    每个主要阶段都要检查候选解释、可区分的预测及相应读数。AI 先用材料、文献和已有结果完成能做的判断。选题、设计、结果解释和开放式优化时，围绕同一主问题多问几层。现在就能回答、会分别改变科学解释、实验比较或资源安排的取舍，尽量在同一批逐项问清。依赖前一答复的留到下一批。同一决定只问一次。用户侧取舍已经明确时，结束本阶段提问，继续已授权工作。

    科研资料先查共享索引，按具体缺口补查并回填。正式构建前核对本阶段的设计依据和关键决定，再按原目标实际运行、比较与交付。
